# PharmaTrace AI — Render Blueprint
# Deploy: https://render.com/docs/blueprint-spec

databases:
  - name: pharmatrace-db
    plan: free
    databaseName: pharmatrace
    user: pharmatrace_user

services:
  # ── Node.js Web Server ─────────────────────────────────────
  - type: web
    name: pharmatrace-web
    runtime: node
    plan: free
    buildCommand: npm install && node init-db.js
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: pharmatrace-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: AI_SERVICE_URL
        fromService:
          name: pharmatrace-ai
          type: web
          property: host
    healthCheckPath: /login

  # ── Python AI Microservice ─────────────────────────────────
  - type: web
    name: pharmatrace-ai
    runtime: python
    plan: free
    rootDir: ai_service
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn fraud_detection:app --bind 0.0.0.0:$PORT
    envVars:
      - key: FLASK_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.6"
